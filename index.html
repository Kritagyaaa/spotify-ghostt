<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E C H O R D</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
    }
    .loader-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      user-select: none;
      gap: 16px;
      transform: scale(1.6);
    }
    .loader {
      width: 32px;
      height: 32px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background-color: transparent;
      animation: loader-rotate 1.5s linear infinite;
      z-index: 0;
    }
    @keyframes loader-rotate {
      0% {
        transform: rotate(90deg);
        box-shadow:
          0 2px 2px 0 #fff inset,
          0 5px 8px 0 #d95f8c inset,
          0 7px 7px 0 #870339 inset;
      }
      50% {
        transform: rotate(270deg);
        background: #0d0d0d;
        box-shadow:
          0 2px 2px 0 #fff inset,
          0 5px 8px 0 #870339 inset,
          0 7px 7px 0 #d95f8c inset;
      }
      100% {
        transform: rotate(450deg);
        box-shadow:
          0 2px 2px 0 #fff inset,
          0 5px 8px 0 #d95f8c inset,
          0 7px 7px 0 #870339 inset;
      }
    }
    .letter-wrapper {
      display: flex;
      gap: 2px;
    }
    .loader-letter {
      display: inline-block;
      opacity: 0.4;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      transform: translateY(0);
      animation: loader-letter-anim 2s infinite;
      z-index: 1;
      border-radius: 50ch;
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loader-letter:nth-child(1) { animation-delay: 0s; }
    .loader-letter:nth-child(2) { animation-delay: 0.1s; }
    .loader-letter:nth-child(3) { animation-delay: 0.2s; }
    .loader-letter:nth-child(4) { animation-delay: 0.3s; }
    .loader-letter:nth-child(5) { animation-delay: 0.4s; }
    .loader-letter:nth-child(6) { animation-delay: 0.5s; }
    .loader-letter:nth-child(7) { animation-delay: 0.6s; }
    .loader-letter:nth-child(8) { animation-delay: 0.7s; }
    .loader-letter:nth-child(9) { animation-delay: 0.8s; }
    .loader-letter:nth-child(10) { animation-delay: 0.9s; }
    @keyframes loader-letter-anim {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      20% { opacity: 1; transform: scale(1.15); }
      40% { opacity: 0.7; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: #0d0d0d;">
      <div class="loader-wrapper">
        <div class="loader"></div>
        <div class="letter-wrapper">
          <span class="loader-letter">L</span>
          <span class="loader-letter">o</span>
          <span class="loader-letter">a</span>
          <span class="loader-letter">d</span>
          <span class="loader-letter">i</span>
          <span class="loader-letter">n</span>
          <span class="loader-letter">g</span>
          <span class="loader-letter">.</span>
          <span class="loader-letter">.</span>
          <span class="loader-letter">.</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
